<nz-card [nzTitle]="'Billing'" [nzExtra]="refreshButton">
  <ng-template #refreshButton>
    <button nz-button nzType="primary" (click)="loadBillings()">
      <span nz-icon nzType="reload"></span>
      Refresh
    </button>
  </ng-template>

  <ng-container *ngIf="!selectedBillingId; else detailsView">
    <nz-table
      #billingTable
      [nzData]="billings"
      [nzLoading]="isLoading"
      [nzBordered]="true"
      [nzPageSize]="10"
      [nzFrontPagination]="true"
      [nzNoResult]="'No billing headers found.'"
    >
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Start Date</th>
          <th scope="col">End Date</th>
          <th scope="col">Total</th>
          <th scope="col">Status</th>
          <th scope="col">Remarks</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let billing of billingTable.data; trackBy: trackById"
          (click)="selectBilling(billing)"
          style="cursor: pointer"
        >
          <td>{{ billing.id }}</td>
          <td>{{ billing.startDate | date: "mediumDate" }}</td>
          <td>{{ billing.endDate | date: "mediumDate" }}</td>
          <td>{{ billing.total | currency: "PHP" }}</td>
          <td>
            <nz-tag [nzColor]="billing.isPaid ? 'green' : 'default'">
              {{ billing.isPaid ? "Paid" : "Open" }}
            </nz-tag>
          </td>
          <td>{{ billing.remarks || "—" }}</td>
          <td (click)="$event.stopPropagation()">
            <button
              nz-button
              nzType="default"
              nzSize="small"
              nz-popconfirm
              nzPopconfirmTitle="Compute this billing?"
              nzPopconfirmPlacement="left"
              (nzOnConfirm)="computeBilling(billing)"
              (click)="$event.stopPropagation()"
            >
              Compute
            </button>
          </td>
        </tr>
      </tbody>
    </nz-table>
  </ng-container>

  <ng-template #detailsView>
    <div>
      <button
        nz-button
        nzType="default"
        style="margin-bottom: 16px"
        (click)="backToList()"
      >
        <span nz-icon nzType="arrow-left"></span>
        Back
      </button>
      <app-billing-details
        [billingId]="selectedBillingId"
      ></app-billing-details>
    </div>
  </ng-template>
</nz-card>
